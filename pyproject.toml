[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "sigma-probe"
version = "3.0.0rc1"
description = "Offline, evidence-first web access-log security triage"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Upstream-Unverified"
authors = [{name = "Original project: Etern1ty Crypto / eternity-crypto"}]
dependencies = []

[project.scripts]
sigma-probe = "sigma_probe.main:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
