services:
  sigma-probe:
    build:
      context: .
    image: sigma-probe:3.0.0rc1
    user: "${SIGMA_UID:-10001}:${SIGMA_GID:-10001}"
    command: ["analyze", "--input", "/logs/access.log", "--output", "/reports", "--site", "demo-site"]
    network_mode: none
    read_only: true
    restart: "no"
    volumes:
      - ./examples:/logs:ro
      - ./reports:/reports:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 64
