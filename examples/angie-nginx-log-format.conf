# Include inside the Nginx/Angie http block. Keep one site's log per run.
log_format sigma_probe_json escape=json
    '{"time_iso8601":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status":"$status",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"http_user_agent":"$http_user_agent",'
    '"host":"$server_name"}';

# Include this directive inside the site's server block:
# access_log /var/log/nginx/site-a.sigma.jsonl sigma_probe_json;
